<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bài tập: Cân nặng các con vật</title>
<style>
:root{--bg:#fff;--fg:#1e1e1e;--box:#d6e2f4;--boxh:#bcd0ee;--dot:#111;--line:#2f6fd6;--ok:#2e9d57;--bad:#d9423a;--bar:#c8ebe1;--teal:#46aa96;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17191c;--fg:#f0f0f0;--box:#2b3a52;--boxh:#38507a;--dot:#eee;--line:#6fa3ff;--bar:#1f3a35}}
:root[data-theme="dark"]{--bg:#17191c;--fg:#f0f0f0;--box:#2b3a52;--boxh:#38507a;--dot:#eee;--line:#6fa3ff;--bar:#1f3a35}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px 28px}
h1{font-size:clamp(18px,3.4vw,26px);font-weight:500;margin:0 0 6px;display:flex;gap:10px;align-items:flex-start;line-height:1.35}
h1:before{content:"";flex:none;width:20px;height:20px;border-radius:50%;background:var(--teal);margin-top:4px}
.hint{margin:0 0 16px;font-size:14px;opacity:.7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px}
.card{position:relative;padding:6px 0 4px}
.img{height:clamp(90px,24vw,170px);display:flex;align-items:flex-end;justify-content:center}
.img img{max-height:100%;max-width:92%;object-fit:contain}
.adot{width:14px;height:14px;border-radius:50%;background:transparent;margin:12px auto 34px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{position:relative;border:0;border-radius:12px;background:var(--box);color:var(--fg);font-weight:600;font-size:clamp(14px,3.6vw,22px);line-height:1;font-family:inherit;padding:16px 4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt:active{background:var(--boxh)}
.opt .od{position:absolute;left:50%;top:-22px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:transparent}
.opt.sel{background:var(--boxh);outline:3px solid var(--line)}
.opt.ok{outline:3px solid var(--ok);background:color-mix(in srgb,var(--ok) 25%,var(--box))}
.opt.bad{outline:3px solid var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--box))}
svg.ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
svg.ln line{stroke:var(--line);stroke-width:4;stroke-linecap:round}
svg.ln line.ok{stroke:var(--ok)}svg.ln line.bad{stroke:var(--bad)}
.bar{margin-top:22px;background:var(--bar);border-radius:10px;padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button.act{border:0;border-radius:999px;padding:12px 22px;font-weight:600;font-size:16px;font-family:inherit;cursor:pointer;background:var(--teal);color:#fff}
button.act.sec{background:transparent;color:var(--fg);border:2px solid var(--teal)}
#res{font-weight:600;font-size:16px;flex:1;min-width:140px}
</style></head><body><main>
<h1>Nối con vật với cân nặng phù hợp.</h1>
<p class="hint">Chạm vào một số đo để nối với con vật.</p>
<div class="grid" id="grid"></div>
<div class="bar"><button class="act" id="chk">Kiểm tra</button><button class="act sec" id="rst">Làm lại</button><span id="res"></span></div>
</main>

   q.o.map(function(t,j){return '<button class="opt" data-i="'+i+'" data-j="'+j+'"><span class="od"></span>'+t+'</button>'}).join("")+
   '</div><svg class="ln"></svg>';
  grid.appendChild(c);
});
function draw(){
  document.querySelectorAll(".card").forEach(function(c,i){
    var s=c.querySelector("svg"),cr=c.getBoundingClientRect();s.innerHTML="";
    c.querySelectorAll(".opt").forEach(function(b,j){
      b.className="opt"+(sel[i]===j?(checked?(Q[i].a===j?" ok":" bad"):" sel"):"");
    });
    if(sel[i]===null)return;
    var a=c.querySelector(".adot").getBoundingClientRect(),d=c.querySelectorAll(".od")[sel[i]].getBoundingClientRect();
    var l=document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1",a.left+a.width/2-cr.left);l.setAttribute("y1",a.top+a.height/2-cr.top);
    l.setAttribute("x2",d.left+d.width/2-cr.left);l.setAttribute("y2",d.top+d.height/2-cr.top);
    if(checked)l.setAttribute("class",Q[i].a===sel[i]?"ok":"bad");
    s.appendChild(l);
  });
}
grid.addEventListener("click",function(e){
  var b=e.target.closest(".opt");if(!b)return;
  sel[+b.dataset.i]=+b.dataset.j;checked=false;document.getElementById("res").textContent="";draw();
});
document.getElementById("chk").onclick=function(){
  if(sel.indexOf(null)>-1){document.getElementById("res").textContent="Con hãy nối đủ 4 con vật nhé!";return}
  checked=true;var n=0;Q.forEach(function(q,i){if(sel[i]===q.a)n++});
  document.getElementById("res").textContent=n===4?"Giỏi quá! Đúng cả 4/4 🎉":"Đúng "+n+"/4. Sửa lại các câu màu đỏ nhé!";draw();
};
document.getElementById("rst").onclick=function(){sel=[null,null,null,null];checked=false;document.getElementById("res").textContent="";draw()};
window.addEventListener("resize",draw);window.addEventListener("load",draw);setTimeout(draw,100);
</script></body></html>
